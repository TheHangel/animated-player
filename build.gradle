plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    // Dev-only helpers (auto screenshots for testing); never shipped in the jar.
    debug {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        debugClient {
            client()
            sourceSet = sourceSets.debug
            systemProperty 'animatedplayer.debug', 'true'
            // ./gradlew runDebugClient -Pscenario=skins
            systemProperty 'animatedplayer.debug.scenario', (project.findProperty('scenario') ?: 'full').toString()
            // -Psetup=<file>: extra commands for the compat scenario
            systemProperty 'animatedplayer.debug.setup', (project.findProperty('setup') ?: '').toString()
            systemProperty 'animatedplayer.debug.skinFile', (project.findProperty('skinFile') ?: '').toString()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.debug)
        }
    }
}

configurations {
    debugImplementation.extendsFrom implementation
}

// Make the debug source set see Minecraft/NeoForge classes too.
neoForge.addModdingDependenciesTo(sourceSets.debug)

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
