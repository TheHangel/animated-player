// Multi-loader layout: common (shared code, vanilla only), neoforge and fabric (entry points, loader hooks).
// The loader projects compile the common sources and resources into their own jar.
plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'fabric-loom' version '1.11.8' apply false
}

subprojects {
    apply plugin: 'java'

    group = mod_group_id
    version = "${minecraft_version}-${mod_version}"

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    // The license text ships in every jar.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            rename { "LICENSE_${mod_id}" }
        }
    }

    // Dev-only test driver (runDebugClient, automatic screenshots); never shipped in the jars.
    sourceSets {
        debug {
            compileClasspath += main.output
            runtimeClasspath += main.output
        }
    }
}

// The values the loader metadata files (neoforge.mods.toml, fabric.mod.json) are expanded with.
ext.modProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : "${minecraft_version}-${mod_version}",
        mod_authors            : mod_authors,
        mod_license            : mod_license,
        mod_description        : mod_description,
]
